name: pr

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]
  
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build and test ${{matrix.os}} - .NET ${{matrix.dotnet-version}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dotnet-version: ['8.0.x', '9.0.x']

    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Build netstandard2.0
        run: dotnet build Spice/Spice.csproj --no-restore --framework netstandard2.0 --configuration Release
      - name: Build net8.0
        run: dotnet build Spice/Spice.csproj --no-restore --framework net8.0 --configuration Release
      - name: Build net9.0
        run: dotnet build Spice/Spice.csproj --no-restore --framework net9.0 --configuration Release
      - name: Build net10.0
        run: dotnet build Spice/Spice.csproj --no-restore --framework net10.0 --configuration Release
      - name: Test
        env:
          API_KEY: ${{ secrets.SPICE_CLOUD_API_KEY }}
        run: dotnet test --no-build --verbosity normal --configuration Release
